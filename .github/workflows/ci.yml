name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Unit, API and GGUF export tests
        run: python -m pytest tests/unit tests/test_api_endpoints.py tests/test_gguf_export_e2e.py -q -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright API flows against the real backend
        working-directory: frontend
        env:
          LLMMAKER_DATA_DIR: ${{ runner.temp }}/llm-maker-e2e
        run: npm run test:e2e

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  desktop:
    name: Desktop shell check
    runs-on: windows-latest
    env:
      # Build into a workspace-local target dir so cached artifacts stay with the
      # checkout and never depend on a machine-local Cargo config.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend assets
        env:
          TAURI_BUILD: "true"
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc