name: Release Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      LLMMAKER_PYTHON_URL: ${{ vars.LLMMAKER_PYTHON_URL }}
      LLMMAKER_PYTHON_SHA256: ${{ vars.LLMMAKER_PYTHON_SHA256 }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            website/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Require pinned CPython source
        shell: pwsh
        run: |
          if (-not $env:LLMMAKER_PYTHON_URL -or -not $env:LLMMAKER_PYTHON_SHA256) {
            throw "Set repository variables LLMMAKER_PYTHON_URL and LLMMAKER_PYTHON_SHA256 to a pinned python-build-standalone x86_64 archive."
          }
      - name: Download pinned CPython
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cpython.zip"
          Invoke-WebRequest -Uri $env:LLMMAKER_PYTHON_URL -OutFile $archive
          "LLMMAKER_PYTHON_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build NSIS installer
        shell: pwsh
        run: |
          ./scripts/build_installer.ps1 -PythonArchive $env:LLMMAKER_PYTHON_ARCHIVE -PythonSha256 $env:LLMMAKER_PYTHON_SHA256
          ./scripts/verify_installer.ps1
      - name: Sign installer when a certificate is configured
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Warning "No WINDOWS_CERT_PFX_BASE64 secret: publishing an UNSIGNED installer."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $signArgs = @("sign", "/f", $pfx, "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
          if ($env:WINDOWS_CERT_PASSWORD) { $signArgs += @("/p", $env:WINDOWS_CERT_PASSWORD) }
          $signArgs += $installer.FullName
          & $signtool @signArgs
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: llm-maker-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: true
